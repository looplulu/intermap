<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小路 · 真机采集复盘</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9f8;color:#25312b;font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}
header{height:72px;padding:0 32px;border-bottom:1px solid #dde5df;background:#fff;display:flex;align-items:center;gap:24px}a{color:#30763c;text-decoration:none}h1{font-size:21px;margin:0}header span{color:#717b75;font-size:13px;margin-left:auto}
form{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:20px 32px;background:#fff;border-bottom:1px solid #dde5df}input,button,select{font:inherit;border:1px solid #cdd7cf;border-radius:6px;padding:9px 12px;background:#fff;min-height:42px}button{cursor:pointer;color:#286732}button[type=submit]{background:#327a3b;color:#fff;border-color:#327a3b}button:disabled{opacity:.5;cursor:wait}input:focus,button:focus,select:focus{outline:2px solid #7aac82;outline-offset:2px}#status{color:#72651c;font-size:13px;overflow-wrap:anywhere}#outcome{margin:0 0 18px;color:#286732;font-weight:600}#outcome-figure{margin:0 0 20px}
main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 156px)}aside{border-right:1px solid #dde5df;padding:20px;background:#fff}h2{font-size:15px;margin:0 0 12px}#sessions{display:flex;flex-direction:column;gap:8px}.session{text-align:left;padding:12px}.session small{display:block;color:#788079}.session[aria-current=true]{background:#eaf4eb;border-color:#68a573}article{padding:24px 32px;min-width:0}#metadata{color:#69736c;font-size:13px;margin-bottom:18px;overflow-wrap:anywhere}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar select{min-width:280px;max-width:100%}#issues{color:#8d6224;margin-bottom:16px}.frames{display:grid;grid-template-columns:1fr 1fr;gap:24px}.frame{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:10px}.picture{position:relative;width:100%;max-width:360px;aspect-ratio:9/20;background:#edf1ee;overflow:hidden;border:1px solid #d6dfd8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#788079}.picture img{width:100%;height:100%;object-fit:contain}.bounds{position:absolute;border:3px solid #e27033;background:#e2703320;pointer-events:none;display:none}.details{margin-top:24px;border-top:1px solid #dbe3dd;padding-top:20px}pre{font:13px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}#empty{padding:60px 0;color:#7c847e}#content[hidden]{display:none}
</style>
<header><a href="./">返回小路</a><h1>真机采集复盘</h1><span>原始证据 / 待审核地图</span></header>
<form id="login"><label for="password">训练密码</label><input id="password" type="password" autocomplete="off" required><button type="submit">验证并读取</button><button id="refresh" type="button">刷新</button><span id="status" role="status">尚未验证</span></form>
<main><aside><h2>采集会话</h2><div id="sessions"></div></aside><article><div id="empty">验证密码后选择一段采集记录。</div><div id="content" hidden><h2 id="title"></h2><div id="metadata"></div><div id="outcome" role="status"></div><figure class="frame" id="outcome-figure" hidden><figcaption>用户确认时的最近画面</figcaption><div class="picture" id="outcome-frame"></div></figure><div class="toolbar"><label for="actions">操作</label><select id="actions"></select><button id="retry">重试后台分析</button></div><div id="issues"></div><div class="frames"><figure class="frame"><figcaption>操作前 · 目标范围</figcaption><div class="picture" id="before"><span>暂无画面</span><div class="bounds"></div></div></figure><figure class="frame"><figcaption>操作后</figcaption><div class="picture" id="after"><span>暂无画面</span></div></figure></div><section class="details"><h2>操作证据</h2><pre id="evidence"></pre><h2>GUI 补充分析</h2><pre id="gui"></pre><h2>人工标注</h2><pre id="notes"></pre></section></div></article></main>
<script>
'use strict';
let password='',session='',review=null,requestSequence=0;
const $=id=>document.getElementById(id);
const status=value=>{$('status').textContent=value};
async function api(operation,values={}){const response=await fetch('./api/training-evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation,password,...values})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'读取失败');return data;}
async function list(){try{status('正在读取…');const data=await api('list');$('sessions').replaceChildren();for(const item of data.sessions){const b=document.createElement('button');b.className='session';b.textContent=(item.metadata.app_label||item.metadata.app)+' · '+new Date(item.metadata.started_at_ms).toLocaleString();const small=document.createElement('small');small.textContent=`${item.receipt.accepted_seq} 条证据 · ${item.receipt.complete?'已收齐':'上传中'}`;b.append(small);b.onclick=()=>openSession(item.metadata.session_id,b);$('sessions').append(b)}status(`已读取 ${data.sessions.length} 段采集`)}catch(e){status(e.message)}}
async function openSession(id,button){const seq=++requestSequence;session=id;review=null;try{status('正在读取证据…');const data=await api('review',{session_id:id});if(seq!==requestSequence)return;document.querySelectorAll('.session').forEach(b=>b.setAttribute('aria-current',String(b===button)));$('empty').hidden=true;$('content').hidden=false;const m=data.metadata;$('title').textContent=m.app_label||m.app;$('metadata').textContent=`${m.manufacturer||''} ${m.model||''} / Android ${m.android_version||''} / App ${m.target_version||''} / ${m.session_id}`;review=data.review;const outcome=review?.task_outcome;$('outcome').textContent=outcome?`目标：${m.task||'未填写'} · 用户已确认完成（尚未验证页面结果） · 最近操作 ${outcome.last_action_id||'无'}`:`目标：${m.task||'自由探索'} · 本次没有用户完成确认`;$('outcome-figure').hidden=!outcome?.frame;if(outcome?.frame)await picture('outcome-frame',outcome.frame,null,seq);$('actions').replaceChildren();for(const [index,item] of (review?.interactions||[]).entries()){const o=document.createElement('option');o.value=index;o.textContent=`${index+1}. ${item.action_type} · ${item.source.text||item.source.description||item.source.view_id||'无文字目标'}`;$('actions').append(o)}status(data.processing?.status||'等待后台整理');await showAction()}catch(e){status(e.message)}}
async function picture(id,frame,bounds,seq){const container=$(id);container.replaceChildren();if(!frame){container.textContent='缺少这一时刻的画面';return}const data=await api('asset',{session_id:session,asset:frame.payload.asset});if(seq!==requestSequence)return;const img=document.createElement('img');img.alt=id==='before'?'操作前画面':id==='outcome-frame'?'用户确认时的画面':'操作后画面';img.src=data.image;container.style.aspectRatio=`${frame.payload.image_width}/${frame.payload.image_height}`;container.append(img);if(bounds){const marker=document.createElement('div');marker.className='bounds';Object.assign(marker.style,{display:'block',left:`${bounds.x*100}%`,top:`${bounds.y*100}%`,width:`${bounds.w*100}%`,height:`${bounds.h*100}%`});container.append(marker)}}
async function showAction(){const seq=++requestSequence;const item=review?.interactions?.[Number($('actions').value||0)];if(!item){$('issues').textContent='还没有可复盘的操作，请稍后刷新。';$('before').textContent='暂无画面';$('after').textContent='暂无画面';$('evidence').textContent='';$('gui').textContent='';$('notes').textContent='';return}$('issues').textContent=item.issues.length?`待核实：${item.issues.join(' / ')}`:'前后画面已关联；尚未人工审核';$('evidence').textContent=JSON.stringify({action_id:item.action_id,action_type:item.action_type,position_source:item.position_source,touch_point:item.touch_point,source:item.source},null,2);$('gui').textContent=item.gui_evidence?JSON.stringify(item.gui_evidence,null,2):'等待云端分析；原始证据已保留';$('notes').textContent=item.annotations.length?JSON.stringify(item.annotations,null,2):'暂无标注';try{await picture('before',item.before,item.target_bounds_norm,seq);await picture('after',item.after,null,seq)}catch(e){status(e.message)}}
$('login').onsubmit=e=>{e.preventDefault();password=$('password').value;list()};$('refresh').onclick=list;$('actions').onchange=showAction;$('retry').onclick=async()=>{try{await api('retry',{session_id:session});status('已加入后台重试队列')}catch(e){status(e.message)}};
</script>
</html>
